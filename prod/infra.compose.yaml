name: cpm-infra
x-common:
  restart: unless-stopped
  cgroup_parent: cpm.slice
  logging: &id001
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  networks: &id002
  - backend
services:
  rabbitmq:
    restart: unless-stopped
    cgroup_parent: cpm.slice
    logging: *id001
    networks: *id002
    image: ${RABBITMQ_IMAGE:?Pinned infrastructure image required}
    hostname: cpm-prod-rabbitmq
    env_file:
    - path: /etc/cpm/prod/rabbitmq.env
      format: raw
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
    - 127.0.0.1:15672:15672
    mem_limit: 768m
    healthcheck:
      test:
      - CMD-SHELL
      - gosu rabbitmq rabbitmq-diagnostics -q check_running && gosu rabbitmq rabbitmq-diagnostics
        -q check_local_alarms
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
  redis:
    restart: unless-stopped
    cgroup_parent: cpm.slice
    logging: *id001
    networks: *id002
    image: ${REDIS_IMAGE:?Pinned infrastructure image required}
    command:
    - sh
    - -c
    - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 192mb
      --maxmemory-policy noeviction --requirepass "$$BFF_REDIS_PASSWORD"
    env_file:
    - path: /etc/cpm/prod/redis.env
      format: raw
    volumes:
    - redis-data:/data
    mem_limit: 320m
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$BFF_REDIS_PASSWORD" redis-cli ping
      interval: 15s
      timeout: 4s
      retries: 8
  portainer:
    restart: unless-stopped
    cgroup_parent: cpm.slice
    logging: *id001
    networks: *id002
    image: ${PORTAINER_IMAGE:?Pinned infrastructure image required}
    command:
    - --admin-password-file
    - /run/portainer-password
    ports:
    - 127.0.0.1:9443:9443
    volumes:
    - portainer-data:/data
    - /var/run/docker.sock:/var/run/docker.sock
    - /etc/cpm/prod/portainer-password:/run/portainer-password:ro
    mem_limit: 256m
  prometheus:
    restart: unless-stopped
    cgroup_parent: cpm.slice
    logging: *id001
    networks: *id002
    image: ${PROMETHEUS_IMAGE:?Pinned infrastructure image required}
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=512MB
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - prometheus-data:/prometheus
    - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./rules.yaml:/etc/prometheus/rules.yaml:ro
    mem_limit: 256m
  nginx:
    restart: unless-stopped
    cgroup_parent: cpm.slice
    logging: *id001
    networks: *id002
    image: ${NGINX_IMAGE:?Pinned infrastructure image required}
    profiles:
    - ingress
    ports:
    - 80:80
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    - /var/cache/nginx:size=16m,mode=1777
    - /var/run:size=8m,mode=1777
    mem_limit: 96m
  mongo:
    image: ${MONGO_IMAGE:?Pinned MongoDB image required}
    restart: unless-stopped
    hostname: mongo
    cgroup_parent: cpm-mongo.slice
    mem_limit: 1536m
    mem_reservation: 512m
    memswap_limit: 1536m
    stop_grace_period: 120s
    env_file:
    - path: /etc/cpm/prod/mongo.env
      format: raw
    command:
    - mongod
    - --config
    - /etc/mongod.conf
    ports:
    - 127.0.0.1:27017:27017
    networks:
    - backend
    volumes:
    - /srv/cpm/mongo/data:/data/db
    - /srv/cpm/mongo/configdb:/data/configdb
    - ./mongod.conf:/etc/mongod.conf:ro
    - /etc/cpm/prod/mongo-replica.key:/run/mongo-replica.key:ro
    - /etc/cpm/prod/mongo-tools.yaml:/run/mongo-tools.yaml:ro
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --host 127.0.0.1 --username "$$MONGO_INITDB_ROOT_USERNAME"
        --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
        ''quit(db.adminCommand({hello:1}).isWritablePrimary ? 0 : 1)'''
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  backend:
    external: true
    name: cpm-prod-backend
volumes:
  rabbitmq-data: null
  redis-data: null
  portainer-data: null
  prometheus-data: null
