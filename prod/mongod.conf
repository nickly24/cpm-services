storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
  journal:
    commitIntervalMs: 100
net:
  bindIpAll: true
  port: 27017
security:
  authorization: enabled
  keyFile: /run/mongo-replica.key
replication:
  replSetName: cpm-rs
  oplogSizeMB: 256
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
