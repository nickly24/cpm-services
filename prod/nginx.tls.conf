pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 32m;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Local deployment probes and SSH diagnostics keep working without public DNS/TLS.
  server {
    listen 80 default_server;
    server_name _;
    location = /health/live { return 200 'ok\n'; }
    location = /health/ready {
      set $backend http://bff:8001;
      proxy_pass $backend;
      proxy_connect_timeout 3s;
    }
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
      try_files $uri =404;
    }
    location /bff/ {
      set $backend http://bff:8001;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
      proxy_send_timeout 65s;
    }
    location / { return 404; }
  }
  server {
    listen 80;
    server_name back1.cpm-lms.ru;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
      try_files $uri =404;
    }
    location / { return 308 https://back1.cpm-lms.ru:8443$request_uri; }
  }
  server {
    listen 443 ssl;
    server_name back1.cpm-lms.ru;
    ssl_certificate /etc/letsencrypt/live/back1.cpm-lms.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back1.cpm-lms.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    location = /health/live { return 200 'ok\n'; }
    location = /health/ready {
      set $backend http://bff:8001;
      proxy_pass $backend;
      proxy_connect_timeout 3s;
    }
    location /bff/ {
      set $backend http://bff:8001;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
      proxy_send_timeout 65s;
    }
    location / { return 404; }
  }
}
