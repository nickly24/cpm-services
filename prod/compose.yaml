  uploads:
    image: ${IMAGE_UPLOADS:?Frozen release digest required}
    restart: unless-stopped
    environment:
      UPLOADS_LISTEN_ADDR: 0.0.0.0:8014
      UPLOADS_AUTH_URL: http://auth:8002
      UPLOADS_CORE_URL: http://core:8003
      UPLOADS_CARDS_URL: http://cards:8008
      UPLOADS_EXAMS_URL: http://exams:8010
      UPLOADS_HOMEWORK_URL: http://homework:8006
      UPLOADS_ATTENDANCE_URL: http://attendance:8013
      UPLOADS_TESTS_URL: http://tests:8004
      APP_ENV: production
      GOMEMLIMIT: 384MiB
      UPLOADS_OPERATIONS_ENABLED: '1'
      RABBITMQ_VHOST: cpm_prod
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 96
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - /uploads
      - healthcheck
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - backend
    cgroup_parent: cpm.slice
    memswap_limit: 512m
    stop_grace_period: 60s
    env_file:
    - path: /etc/cpm/prod/uploads.env
      format: raw
    labels:
      cpm.managed: 'true'
      cpm.watchdog: 'true'
      cpm.port: '8014'
      cpm.liveness: /health/live
networks:
  backend:
    external: true
    name: cpm-prod-backend
