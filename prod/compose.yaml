    memswap_limit: 768m
    stop_grace_period: 60s
    env_file:
    - path: /etc/cpm/prod/ratings.env
      format: raw
    labels:
      cpm.managed: 'true'
      cpm.watchdog: 'true'
      cpm.port: '8012'
      cpm.liveness: /health/live
  attendance:
    image: ${IMAGE_ATTENDANCE:?Frozen release digest required}
    restart: unless-stopped
    environment:
      ATTENDANCE_LISTEN_ADDR: 0.0.0.0:8013
      ATTENDANCE_AUTH_URL: http://auth:8002
      ATTENDANCE_CORE_URL: http://core:8003
      APP_ENV: production
      GOMEMLIMIT: 384MiB
    networks:
    - backend
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - /attendance
      - healthcheck
      interval: 15s
      timeout: 8s
      retries: 8
