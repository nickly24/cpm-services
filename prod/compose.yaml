  file-work-service:
    image: ${IMAGE_FILE_WORK_SERVICE:?Frozen release digest required}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:8007
      HOMEWORK_URL: http://homework:8006
      PDF_TEMP_DIR: /tmp
      PDF_PROCESS_TIMEOUT_SECONDS: '120'
      APP_ENV: production
      GOMEMLIMIT: 256MiB
    read_only: true
    tmpfs:
    - /tmp:size=512m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test:
      - CMD
      - /file-work-service
      - healthcheck
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - backend
    cgroup_parent: cpm.slice
    memswap_limit: 1536m
    stop_grace_period: 150s
    env_file:
    - path: /etc/cpm/prod/file-work-service.env
      format: raw
    labels:
      cpm.managed: 'true'
      cpm.watchdog: 'true'
      cpm.port: '8007'
      cpm.liveness: /healthz
  ratings:
    image: ${IMAGE_RATINGS:?Frozen release digest required}
    restart: unless-stopped
    environment:
      RATINGS_LISTEN_ADDR: 0.0.0.0:8012
      RATINGS_AUTH_URL: http://auth:8002
      RATINGS_CORE_URL: http://core:8003
      RATINGS_HOMEWORK_URL: http://homework:8006
      RATINGS_TESTS_URL: http://tests:8004
      RATINGS_CALCULATE_URL: http://calculate:8005
      APP_ENV: production
      GOMEMLIMIT: 576MiB
      RATINGS_EXAMS_MODE: required
      RATINGS_EXTERNAL_TESTS_MODE: required
      RATINGS_EXAMS_URL: http://exams:8010
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
      - CMD
      - /ratings
      - healthcheck
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
