global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# No remote_write or Alertmanager: this Dev monitor keeps all samples locally.
scrape_configs:
  - job_name: bff
    static_configs:
      - targets: [bff:8001]
  - job_name: tests
    static_configs:
      - targets: [tests:8004]
  - job_name: calculate
    static_configs:
      - targets: [calculate:8005]
