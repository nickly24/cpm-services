# Local dev, single node. There are no queues, bindings or definitions here.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Leave headroom below the 768 MiB container limit.
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 2GB

log.console = true
log.console.level = info
log.file = false
